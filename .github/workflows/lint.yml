# ruff on every push and pull request to main, with the rules and the exact ruff
# version in ruff.toml (required-version).

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow's token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install ruff
        run: pip install "ruff$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)"

      - name: Lint (ruff)
        run: ruff check .
